<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED2738"/>
      <stop offset="100%" stop-color="#B91C2C"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="30" height="15" rx="6" ry="6" fill="white" opacity="0.07"/>
  <!-- "IN" text for Infinia -->
  <text x="16" y="22" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">IN</text>
</svg>
